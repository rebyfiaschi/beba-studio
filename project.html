  <script>
    const openMenu = document.querySelector("#openMenu");
    const closeMenu = document.querySelector("#closeMenu");
    const menuOverlay = document.querySelector("#menuOverlay");
    const menuLinks = document.querySelectorAll(".menu-link");

    function showMenu() {
      menuOverlay.classList.remove("-translate-y-full");
      menuOverlay.classList.add("translate-y-0");

      document.body.classList.add("overflow-hidden");

      menuLinks.forEach((link, index) => {
        setTimeout(() => {
          link.classList.remove("translate-y-8", "opacity-0");
          link.classList.add("translate-y-0", "opacity-100");
        }, 250 + index * 120);
      });
    }

    function hideMenu() {
      menuOverlay.classList.remove("translate-y-0");
      menuOverlay.classList.add("-translate-y-full");

      document.body.classList.remove("overflow-hidden");

      menuLinks.forEach((link) => {
        link.classList.remove("translate-y-0", "opacity-100");
        link.classList.add("translate-y-8", "opacity-0");
      });
    }

    openMenu.addEventListener("click", showMenu);
    closeMenu.addEventListener("click", hideMenu);

    menuLinks.forEach((link) => {
      link.addEventListener("click", hideMenu);
    });
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const animatedElements = document.querySelectorAll("[data-animate-class]");

      const observer = new IntersectionObserver(
        (entries, observer) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;

            const element = entry.target;
            const animationClass = element.dataset.animateClass;
            const delay = element.dataset.delay || 0;

            element.style.animationDelay = `${delay}ms`;

            animationClass.split(" ").forEach((className) => {
              element.classList.add(className);
            });

            observer.unobserve(element);
          });
        },
        {
          threshold: 0.05,
          rootMargin: "0px 0px -80px 0px",
        }
      );

      animatedElements.forEach((element) => {
        observer.observe(element);
      });
    });
  </script>
